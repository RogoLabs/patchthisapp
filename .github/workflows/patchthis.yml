name: Update List
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update-list:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    - name: Cache NVD data
      uses: actions/cache@v6
      with:
        path: nvd.jsonl
        key: nvd-data-${{ github.run_number }}
        restore-keys: |
          nvd-data-
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        architecture: 'x64'
        
    # Cache pip dependencies
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        
    - name: Grab Needed Data
      run: |
        set -e  # Exit on any error
        sudo apt-get update && sudo apt-get install unzip jq -y
        
        # Download EPSS data with retry
        for i in {1..3}; do
          if wget https://epss.empiricalsecurity.com/epss_scores-current.csv.gz -O epss_scores-current.csv.gz; then
            break
          elif [ $i -eq 3 ]; then
            echo "Failed to download EPSS data after 3 attempts"
            exit 1
          else
            echo "Attempt $i failed, retrying..."
            sleep 5
          fi
        done
        gzip -f -d epss_scores-current.csv.gz
        
        # Download Metasploit data
        curl -sSf https://raw.githubusercontent.com/rapid7/metasploit-framework/master/db/modules_metadata_base.json | \
          jq -r '.[]|{cve:.references[]|select(startswith("CVE-"))}| join(",")' > metasploit.txt || touch metasploit.txt
        
        # Download Nuclei data
        curl -sSf https://raw.githubusercontent.com/projectdiscovery/nuclei-templates/main/cves.json | \
          jq -r .ID > nuclei.txt || touch nuclei.txt
        
        # Download CISA KEV data with retry
        for i in {1..3}; do
          if wget https://www.cisa.gov/sites/default/files/csv/known_exploited_vulnerabilities.csv -O known_exploited_vulnerabilities.csv; then
            break
          elif [ $i -eq 3 ]; then
            echo "Failed to download CISA data after 3 attempts"
            exit 1
          else
            echo "Attempt $i failed, retrying..."
            sleep 5
          fi
        done

        # Download NVD data with retry
        for i in {1..3}; do
          if wget https://nvd.handsonhacking.org/nvd.jsonl -O nvd.jsonl; then
            break
          elif [ $i -eq 3 ]; then
            echo "WARNING: Failed to download NVD data after 3 attempts"
            if [ -f nvd.jsonl ] && [ -s nvd.jsonl ]; then
              echo "Using cached NVD data"
            else
              echo "No cached NVD data available"
              exit 1
            fi
          else
            echo "Attempt $i failed, retrying..."
            sleep 5
          fi
        done
         
    - name: Lint Python code
      run: |
        pip install ruff
        ruff check patchthisapp.py scripts/

    - name: Smoke test (PR only)
      if: github.event_name == 'pull_request'
      run: |
        touch metasploit.txt nuclei.txt known_exploited_vulnerabilities.csv epss_scores-current.csv nvd.jsonl
        python patchthisapp.py --dry-run || true

    - name: Run PatchThisApp Python Script
      run: |
         python patchthisapp.py

    - name: Validate output
      run: |
        if [ ! -f data/data.csv ]; then
          echo "ERROR: data/data.csv not generated"
          exit 1
        fi
        ROW_COUNT=$(tail -n +2 data/data.csv | wc -l)
        echo "Output contains $ROW_COUNT CVEs"
        if [ "$ROW_COUNT" -lt 1 ]; then
          echo "ERROR: Output CSV is empty"
          exit 1
        fi
        echo "### Vulnerability Data Update" >> $GITHUB_STEP_SUMMARY
        echo "- **CVEs processed:** $ROW_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "- **Run time:** $(date -u)" >> $GITHUB_STEP_SUMMARY

    - name: Audit remediation guidance coverage
      run: |
          python - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          csv_path = Path('web/data.csv')
          guidance_path = Path('web/cve-guidance.json')
          if not guidance_path.is_file():
              raise SystemExit('ERROR: web/cve-guidance.json was not generated')

          with csv_path.open(newline='', encoding='utf-8') as csv_file:
              rows = list(csv.DictReader(csv_file))
          with guidance_path.open(encoding='utf-8') as guidance_file:
              guidance = json.load(guidance_file)

          generated_at = guidance.get('generated_at_utc', '')
          try:
              timestamp = datetime.fromisoformat(generated_at.replace('Z', '+00:00'))
          except ValueError as error:
              raise SystemExit(f'ERROR: invalid guidance timestamp: {generated_at}') from error
          if timestamp.tzinfo is None:
              raise SystemExit('ERROR: guidance timestamp must include a UTC offset')
          if timestamp.utcoffset().total_seconds() != 0:
              raise SystemExit('ERROR: guidance timestamp must be in UTC')

          cves = guidance.get('cves', {})
          if not isinstance(cves, dict):
              raise SystemExit('ERROR: guidance cves field must be an object')
          dataset_cves = {row['CVE'] for row in rows}
          orphaned_cves = set(cves) - dataset_cves
          if orphaned_cves:
              raise SystemExit(f'ERROR: guidance contains {len(orphaned_cves)} CVEs absent from web/data.csv')

          kev_cves = {row['CVE'] for row in rows if 'CISA' in row.get('Source', '').split('/')}
          kev_actions = sum(bool((cves.get(cve, {}).get('kev') or {}).get('required_action')) for cve in kev_cves)
          kev_due_dates = sum(bool((cves.get(cve, {}).get('kev') or {}).get('due_date')) for cve in kev_cves)
          patch_references = [
              reference
              for entry in cves.values()
              for reference in entry.get('nvd_references', [])
              if reference.get('url') and any(str(tag).strip().lower() == 'patch' for tag in reference.get('tags', []))
          ]
          patch_reference_cves = {
              cve for cve, entry in cves.items()
              if any(
                  reference.get('url') and any(str(tag).strip().lower() == 'patch' for tag in reference.get('tags', []))
                  for reference in entry.get('nvd_references', [])
              )
          }

          summary = [
              '### Remediation guidance coverage',
              f'- **KEV entries in dataset:** {len(kev_cves)}',
              f'- **KEV required actions bundled:** {kev_actions}/{len(kev_cves)}',
              f'- **KEV due dates bundled:** {kev_due_dates}/{len(kev_cves)}',
              f'- **CVEs with NVD Patch references:** {len(patch_reference_cves)}',
              f'- **NVD Patch references:** {len(patch_references)}',
              f'- **Guidance generated (UTC):** {generated_at}',
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary_file:
              summary_file.write('\n'.join(summary) + '\n')
          print('\n'.join(summary))
          PY

    - name: Stage generated data artifacts
      run: git add -f -- data/data.csv web/data.csv web/cve-guidance.json

    - name: Commit changes
      uses: EndBug/add-and-commit@v11
      with:
          default_author: github_actions
          add: 'data/data.csv web/data.csv web/cve-guidance.json'
          message: 'Update vulnerability data - ${{ github.event.head_commit.timestamp }}'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: update-list
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload web folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'web'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
